<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vault SDK Playground</title>
    <script>
      // Paint the right theme before React mounts, so there is no light flash.
      try {
        var stored = localStorage.getItem("vault-sdk-playground-theme");
        var dark =
          stored === "dark" ||
          ((!stored || stored === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
